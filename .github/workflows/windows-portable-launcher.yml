name: Windows portable launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse launchers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @("open-stock-ai.ps1", "stop-stock-ai.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$path has PowerShell parser errors:"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Run launcher contract tests
        shell: powershell
        run: |
          py -m pip install --disable-pip-version-check pytest
          py -m pytest -q tests/test_portable_launcher_contract.py
