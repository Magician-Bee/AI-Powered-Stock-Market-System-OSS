name: Hosted critical retention archive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 0"

permissions:
  contents: read

concurrency:
  group: critical-retention-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-critical-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Export content-addressed critical records
        env:
          SOURCE_DB: ${{ runner.temp }}/stock-ai-retention/source.sqlite
          OFF_HOST_DIR: ${{ runner.temp }}/stock-ai-retention/off-host-artifact
        run: |
          python scripts/run_hosted_retention_archive_gate.py \
            --mode create \
            --source-database "${SOURCE_DB}" \
            --output-dir "${OFF_HOST_DIR}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --allow-retention-archive-drill

      - name: Upload critical archive off host
        uses: actions/upload-artifact@v4
        with:
          name: stock-ai-critical-retention-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stock-ai-retention/off-host-artifact/critical-retention-archive.json
            ${{ runner.temp }}/stock-ai-retention/off-host-artifact/critical-retention-export-evidence.json
          if-no-files-found: error
          retention-days: 90

  clean-runner-restore:
    needs: export-critical-retention
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Download off-host archive into fresh runner
        uses: actions/download-artifact@v4
        with:
          name: stock-ai-critical-retention-${{ github.sha }}
          path: ${{ runner.temp }}/stock-ai-retention/off-host-input

      - name: Restore critical records into a fresh authority
        env:
          OFF_HOST_INPUT: ${{ runner.temp }}/stock-ai-retention/off-host-input
          RESTORE_DIR: ${{ runner.temp }}/stock-ai-retention/clean-restore
        run: |
          test ! -e "${RESTORE_DIR}"
          python scripts/run_hosted_retention_archive_gate.py \
            --mode verify \
            --input-dir "${OFF_HOST_INPUT}" \
            --output-dir "${RESTORE_DIR}" \
            --commit-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --allow-retention-archive-drill

      - name: Verify clean-runner receipt independently
        env:
          RESTORE_DIR: ${{ runner.temp }}/stock-ai-retention/clean-restore
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from open_stock_ai.governance.hosted_retention_gate import verify_hosted_retention_gate_receipt

          receipt = json.loads(
              (Path(os.environ["RESTORE_DIR"]) / "critical-retention-gate-receipt.json").read_text()
          )
          if receipt["commit_sha"] != os.environ["GITHUB_SHA"]:
              raise SystemExit("critical retention candidate SHA mismatch")
          if not receipt["passed"] or not verify_hosted_retention_gate_receipt(receipt):
              raise SystemExit("hosted critical retention receipt failed verification")
          if receipt["production_years_satisfied"] is not False:
              raise SystemExit("hosted artifact must not claim production-years retention")
          PY

      - name: Upload clean-runner restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: stock-ai-critical-retention-restore-${{ github.sha }}
          path: |
            ${{ runner.temp }}/stock-ai-retention/clean-restore/critical-retention-restore-receipt.json
            ${{ runner.temp }}/stock-ai-retention/clean-restore/critical-retention-gate-receipt.json
            ${{ runner.temp }}/stock-ai-retention/clean-restore/restored-critical-retention.sqlite
          if-no-files-found: error
          retention-days: 90
