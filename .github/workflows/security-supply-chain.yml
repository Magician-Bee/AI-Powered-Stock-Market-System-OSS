name: Security supply chain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          upload: false
          output: codeql-results
      - name: Enforce CodeQL high and critical severity gate
        run: >-
          python scripts/check_codeql_sarif.py codeql-results
          --commit "$GITHUB_SHA"
          --receipt /tmp/codeql-security-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-security-receipt
          path: |
            codeql-results
            /tmp/codeql-security-gate.json

  static-and-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install scanners
        run: python -m pip install bandit pip-audit
      - name: Run Bandit high-severity gate
        run: bandit -q -r src -lll
      - name: Export pinned third-party dependencies
        run: >-
          uv export --frozen --no-hashes --no-emit-project
          --output-file /tmp/stock-ai-third-party-requirements.txt
      - name: Run dependency vulnerability gate
        run: >-
          pip-audit --strict --desc
          --no-deps --disable-pip
          --format json
          --output /tmp/pip-audit.json
          --requirement /tmp/stock-ai-third-party-requirements.txt
      - name: Build deterministic SBOM
        run: python scripts/build_sbom.py --output /tmp/stock-ai-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-ai-supply-chain-receipts
          path: |
            /tmp/stock-ai-sbom.cdx.json
            /tmp/pip-audit.json
            /tmp/stock-ai-third-party-requirements.txt
