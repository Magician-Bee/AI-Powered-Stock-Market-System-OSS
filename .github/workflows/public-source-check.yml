name: Public stock source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-source-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare locked development dependencies
        if: hashFiles('scripts/validate_public_release.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/pip" install --disable-pip-version-check uv
          "$RUNNER_TEMP/release-tools/bin/uv" sync --frozen --extra dev --python 3.12
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/review-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/review-bin" gitleaks
      - name: Validate source and the network-blocked regression subset
        if: hashFiles('scripts/validate_public_release.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/validate_public_release.py --gitleaks "$RUNNER_TEMP/review-bin/gitleaks" --output "$RUNNER_TEMP/public-validation.json"
      - name: Store only the de-identified validation summary
        if: success() && hashFiles('scripts/validate_public_release.py') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/public-validation.json
          if-no-files-found: error
          retention-days: 14
