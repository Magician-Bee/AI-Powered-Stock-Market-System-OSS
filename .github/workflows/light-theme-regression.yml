name: Light Theme Regression

on:
  workflow_dispatch:

jobs:
  light-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run light-theme regression checks
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_light_theme_polish.py
