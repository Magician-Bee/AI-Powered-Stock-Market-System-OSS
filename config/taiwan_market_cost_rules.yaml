commission_reference:
  rule_id: tw-broker-commission-reference-2026
  reference_bps: 14.25
  source_ids: [twse-investment-guide-2025, twse-operating-rules-article-94]
  note: Brokers set account-specific rates, discounts and minimum charges; a rate above 14.25 bps requires notice.

tax_rules:
  - rule_id: tw-buy-side-no-securities-transaction-tax
    venues: [TWSE, TPEX]
    product_types: [stock, etf, bond_etf]
    lot_types: [board_lot, odd_lot]
    side: buy
    valid_from: "1965-09-01"
    valid_to: null
    tax_bps: 0.0
    source_ids: [mof-securities-transaction-tax-act]

  - rule_id: tw-stock-standard-seller-tax
    venues: [TWSE, TPEX]
    product_types: [stock]
    lot_types: [board_lot, odd_lot]
    side: sell
    valid_from: "1965-09-01"
    valid_to: null
    tax_bps: 30.0
    source_ids: [mof-securities-transaction-tax-act, twse-investment-guide-2025]

  - rule_id: tw-stock-day-trade-reduced-seller-tax-2017-2027
    venues: [TWSE, TPEX]
    product_types: [stock]
    # The reduced day-trade seller tax applies to offsetting board-lot
    # securities trades.  Odd-lot sales fall through to the normal seller tax.
    lot_types: [board_lot]
    side: sell
    valid_from: "2017-04-28"
    valid_to: "2027-12-31"
    tax_bps: 15.0
    day_trade_offset: true
    source_ids: [mof-securities-transaction-tax-act, twse-investment-guide-2025]

  - rule_id: tw-etf-standard-seller-tax
    venues: [TWSE, TPEX]
    product_types: [etf]
    lot_types: [board_lot, odd_lot]
    side: sell
    valid_from: "1965-09-01"
    valid_to: null
    tax_bps: 10.0
    source_ids: [mof-securities-transaction-tax-act, twse-investment-guide-2025]

  - rule_id: tw-bond-etf-exempt-seller-tax-2017-2026
    venues: [TWSE, TPEX]
    product_types: [bond_etf]
    lot_types: [board_lot, odd_lot]
    side: sell
    valid_from: "2017-01-01"
    valid_to: "2026-12-31"
    tax_bps: 0.0
    bond_etf_tax_exemption_eligible: true
    source_ids: [mof-securities-transaction-tax-act, twse-investment-guide-2025]

  - rule_id: tw-bond-etf-nonexempt-seller-tax
