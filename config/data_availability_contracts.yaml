schema_version: stock_ai.data_availability_contracts.v1

# Dataset IDs admitted by the production PIT feature contract. A source/dataset
# pair still needs an explicit contract below; source defaults are display/live
# fallbacks and never certify a research feature.
research_contract_scope:
  prices: [prices_daily, prices_intraday, prices_adjusted_daily]
  financials: [fundamentals, fundamentals_quarterly, revenues_monthly, valuation_metrics]
  flows: [institutional_flows, margin_trading, borrowed_short, ownership, tdcc_holding_distribution, derivatives, taifex_derivatives]
  events: [events, company_events, documents, event_impacts, price_adjustment_events]
  macro: [macro, macro_series]

# Every registered source is declared here.  Source defaults are intentionally
# conservative; a warehouse dataset only becomes PIT-eligible through a more
# specific reviewed contract below.
source_defaults:
  - source_id: twse_isin
    basis: acquisition_only
    historical_pit_eligible: false
    reason: current_security_catalogue_does_not_attest_historical_publication_time
  - source_id: twse_openapi
    basis: acquisition_only
    historical_pit_eligible: false
    reason: original_publication_time_not_attested_by_current_openapi
  - source_id: tpex_openapi
    basis: acquisition_only
    historical_pit_eligible: false
    reason: original_publication_time_not_attested_by_current_openapi
  - source_id: tpex_official_web
    basis: acquisition_only
    historical_pit_eligible: false
    reason: original_publication_time_not_attested_by_current_official_page
  - source_id: mops
    basis: unverified
    historical_pit_eligible: false
    reason: dataset_specific_disclosure_contract_required
  - source_id: mops_archive
    basis: acquisition_only
    historical_pit_eligible: false
    reason: historical_archive_does_not_supply_original_publication_time
  - source_id: tdcc
    basis: unverified
    historical_pit_eligible: false
    reason: dataset_specific_depository_contract_required
  - source_id: tdcc_openapi
    basis: acquisition_only
    historical_pit_eligible: false
    reason: latest_snapshot_api_does_not_attest_historical_availability
  - source_id: taifex_openapi
    basis: acquisition_only
    historical_pit_eligible: false
    reason: original_publication_time_not_attested_by_current_openapi
  - source_id: twse_mis
    basis: acquisition_only
    historical_pit_eligible: false
    reason: live_quote_capture_has_no_historical_replay_attestation
  - source_id: yahoo_finance
    basis: acquisition_only
    historical_pit_eligible: false
    reason: auxiliary_history_is_retrieved_now_not_historically_attested
  - source_id: twse_official_web
    basis: acquisition_only
    historical_pit_eligible: false
    reason: original_publication_time_not_attested_by_current_official_page
  - source_id: fugle_marketdata
    basis: acquisition_only
    historical_pit_eligible: false
    reason: licensed_live_capture_has_no_historical_replay_attestation
  - source_id: fugle_stream
    basis: acquisition_only
    historical_pit_eligible: false
    reason: live_stream_capture_has_no_historical_replay_attestation
  - source_id: google_news
    basis: unverified
    historical_pit_eligible: false
    reason: dataset_specific_publisher_contract_required

