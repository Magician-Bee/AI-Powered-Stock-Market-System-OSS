  - {source_id: tpex_openapi, domain: security_master, basis: acquisition_only, historical_pit_eligible: false, reason: security_master_snapshot_has_no_historical_publication_attestation}
  - {source_id: twse_mis, domain: prices_intraday, basis: acquisition_only, historical_pit_eligible: false, reason: live_quote_capture_has_no_historical_replay_attestation}
  - {source_id: twse_official_web, domain: borrowed_short, basis: market_schedule, historical_pit_eligible: true, timezone: Asia/Taipei, scheduled_time: "15:00", reason: official_daily_borrowed_short_data_available_after_reviewed_close_window}
