  - {source_id: tpex_official_web, domain: prices_daily, basis: market_schedule, historical_pit_eligible: true, timezone: Asia/Taipei, scheduled_time: "15:00", reason: official_tpex_daily_market_data_available_after_reviewed_close_window}
