  - {source_id: fugle_stream, domain: prices_intraday, basis: acquisition_only, historical_pit_eligible: false, reason: live_stream_capture_has_no_historical_replay_attestation}
  - {source_id: google_news, domain: news, basis: source_published, historical_pit_eligible: true, requires_published_at: true, reason: publisher_timestamp_required_for_news_replay}
