schema_version: open_stock_ai.authoritative_store_matrix.v1
source_of_truth: config/authoritative_store_matrix.yaml
description: >-
  Machine-readable ownership map for durable domain state. An entry marked
  transitional is intentionally not a release claim: its migration blockers
  must be cleared before the domain is promoted to canonical.
domains:
