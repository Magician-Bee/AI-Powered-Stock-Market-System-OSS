schema_version: stock_ai.source_registry.v2
cache_policies:
  - dataset: prices_intraday
    ttl_seconds: 5
    stale_while_revalidate_seconds: 10
    invalidate_on: [market_session_change, authorization_change]
  - dataset: security_master
    ttl_seconds: 21600
    stale_while_revalidate_seconds: 86400
    invalidate_on: [listing_event, delisting_event, symbol_change]
  - dataset: prices_daily
    ttl_seconds: 900
    stale_while_revalidate_seconds: 3600
    invalidate_on: [official_revision, corporate_action]
  - dataset: prices_adjusted_daily
    ttl_seconds: 900
    stale_while_revalidate_seconds: 3600
    invalidate_on: [official_revision, corporate_action, adjustment_factor_revision]
  - dataset: institutional_flows
    ttl_seconds: 900
    stale_while_revalidate_seconds: 3600
    invalidate_on: [official_revision]
  - dataset: margin_trading
    ttl_seconds: 900
    stale_while_revalidate_seconds: 3600
    invalidate_on: [official_revision]
  - dataset: revenues_monthly
    ttl_seconds: 21600
    stale_while_revalidate_seconds: 86400
    invalidate_on: [mops_revision]
  - dataset: fundamentals
    ttl_seconds: 21600
    stale_while_revalidate_seconds: 86400
    invalidate_on: [mops_revision, restatement]
  - dataset: fundamentals_quarterly
    ttl_seconds: 21600
    stale_while_revalidate_seconds: 86400
    invalidate_on: [mops_revision, restatement]
  - dataset: events
    ttl_seconds: 900
    stale_while_revalidate_seconds: 3600
    invalidate_on: [source_revision, duplicate_resolution]
  - dataset: macro
    ttl_seconds: 21600
    stale_while_revalidate_seconds: 86400
    invalidate_on: [official_revision]
  - dataset: derivatives
    ttl_seconds: 300
    stale_while_revalidate_seconds: 900
    invalidate_on: [session_change, contract_expiry]
sources:
  - source_id: twse_openapi
    display_name: Taiwan Stock Exchange OpenAPI
    authority: official_exchange
    base_url: https://openapi.twse.com.tw/v1
    license_status: official_api_terms_review_required
    update_frequency_seconds: 300
    reliability_tier: 1
    priority: 10
    domains: [security_master, prices_daily, institutional_flow, margin, revenue, indices, warrants]
    failover_source_ids: []
    host_aliases: [www.twse.com.tw]
    field_contract:
      timezone: Asia/Taipei
      currency: TWD
      immutable_raw_payload: true
      terms_url: https://www.twse.com.tw/zh/products/information/use.html
      usage_boundary: public_api_research_and_internal_analysis
  - source_id: tpex_openapi
    display_name: Taipei Exchange OpenAPI
    authority: official_exchange
    base_url: https://www.tpex.org.tw/openapi/v1
    license_status: official_api_terms_review_required
    update_frequency_seconds: 300
    reliability_tier: 1
    priority: 10
    domains: [security_master, prices_daily, margin, emerging, indices, warrants]
    failover_source_ids: []
    host_aliases: []
    field_contract:
      timezone: Asia/Taipei
      currency: TWD
      immutable_raw_payload: true
      terms_url: https://www.tpex.org.tw/openapi/
      usage_boundary: public_api_research_and_internal_analysis
  - source_id: tpex_official_web
    display_name: Taipei Exchange official website data API
    authority: official_exchange_web
    base_url: https://www.tpex.org.tw/www
    license_status: official_website_terms_review_required
    update_frequency_seconds: 21600
    reliability_tier: 1
    priority: 10
    domains: [security_master, prices_daily, corporate_actions, delisted, borrowed_short, daytrade]
    failover_source_ids: [tpex_openapi]
    host_aliases: []
    field_contract:
      timezone: Asia/Taipei
      currency: TWD
      immutable_raw_payload: true
      terms_url: https://www.tpex.org.tw/zh-tw/gtsm_disclaimer.html
      usage_boundary: public_website_research_and_internal_analysis
  - source_id: mops
    display_name: Market Observation Post System
    authority: official_disclosure
    base_url: https://mops.twse.com.tw
    license_status: official_disclosure_terms_review_required
    update_frequency_seconds: 900
    reliability_tier: 1
    priority: 10
    domains: [fundamentals, revenue, material_events, documents, corporate_actions]
    failover_source_ids: []
    host_aliases: []
    field_contract:
      point_in_time_required: true
      revision_history_required: true
      terms_url: https://mops.twse.com.tw
      usage_boundary: public_disclosure_research
  - source_id: mops_archive
    display_name: Market Observation Post System Historical Archive
    authority: official_disclosure_archive
    base_url: https://mopsov.twse.com.tw
    license_status: official_disclosure_terms_review_required
    update_frequency_seconds: 21600
    reliability_tier: 1
    priority: 11
    domains: [revenue, fundamentals]
    failover_source_ids: []
    host_aliases: []
    field_contract:
      point_in_time_required: true
      revision_history_required: true
      archive_start_period: 2010-01
      ifrs_statement_archive_start_period: 2013-Q1
      archive_publication_timestamp_available: false
      terms_url: https://mops.twse.com.tw
      usage_boundary: public_disclosure_research
  - source_id: tdcc
    display_name: Taiwan Depository and Clearing Corporation
    authority: official_depository
    base_url: https://www.tdcc.com.tw
    license_status: official_publication_terms_review_required
    update_frequency_seconds: 86400
    reliability_tier: 1
    priority: 10
    domains: [ownership, holding_distribution]
    failover_source_ids: []
    host_aliases: []
    field_contract:
      point_in_time_required: true
      terms_url: https://www.tdcc.com.tw
      usage_boundary: published_statistics_research
  - source_id: tdcc_openapi
    display_name: Taiwan Depository and Clearing Corporation OpenAPI
    authority: official_depository
    base_url: https://openapi.tdcc.com.tw
    license_status: official_publication_terms_review_required
    update_frequency_seconds: 604800
    reliability_tier: 1
    priority: 10
    domains: [ownership, holding_distribution]
    failover_source_ids: []
    host_aliases: []
    field_contract:
      point_in_time_required: true
      latest_snapshot_only: true
      terms_url: https://www.tdcc.com.tw
      usage_boundary: published_statistics_research
  - source_id: taifex_openapi
    display_name: Taiwan Futures Exchange OpenAPI
    authority: official_exchange
    base_url: https://openapi.taifex.com.tw
    license_status: official_api_terms_review_required
    update_frequency_seconds: 300
    reliability_tier: 1
    priority: 10
    domains: [futures, options, institutional_derivatives]
    failover_source_ids: []
    host_aliases: []
    field_contract:
      contract_multiplier_required: true
      session_required: true
      terms_url: https://openapi.taifex.com.tw
      usage_boundary: public_api_research_and_internal_analysis
  - source_id: twse_mis
    display_name: TWSE MIS public intraday quote
    authority: official_exchange_web
    base_url: https://mis.twse.com.tw
    license_status: trading_information_contract_required
    update_frequency_seconds: 5
    reliability_tier: 1
    priority: 20
    domains: [prices_intraday, order_book]
    failover_source_ids: [twse_openapi]
    host_aliases: []
    field_contract:
      quote_kind_required: true
      authorization_required_for_execution: true
      terms_url: https://www.twse.com.tw/zh/products/information/use.html
      redistribution_allowed: false
  - source_id: yahoo_finance
    display_name: Yahoo Finance
    authority: auxiliary
    base_url: https://query1.finance.yahoo.com
    license_status: research_only_terms_review_required
    update_frequency_seconds: 900
    reliability_tier: 3
    priority: 90
    domains: [prices_daily, prices_intraday, global_indices, fx, commodities, news]
    failover_source_ids: []
    host_aliases: [query2.finance.yahoo.com, finance.yahoo.com]
    field_contract:
      fallback_only: true
      execution_eligible: false
      terms_url: https://legal.yahoo.com/us/en/yahoo/terms/product-atos/apiforydn/index.html
      redistribution_allowed: false
  - source_id: twse_official_web
    display_name: Taiwan Stock Exchange official website data API
    authority: official_exchange_web
    base_url: https://www.twse.com.tw
    license_status: official_website_terms_review_required
    update_frequency_seconds: 900
    reliability_tier: 1
    priority: 10
    domains: [prices_daily, corporate_actions, institutional_flow, borrowed_short, daytrade]
    failover_source_ids: [twse_openapi]
    host_aliases: []
    field_contract:
      timezone: Asia/Taipei
      currency: TWD
      immutable_raw_payload: true
      terms_url: https://www.twse.com.tw/zh/products/information/use.html
      usage_boundary: public_website_research_and_internal_analysis
  - source_id: fugle_marketdata
    display_name: Fugle licensed market data
    authority: licensed_vendor
    base_url: https://api.fugle.tw/marketdata/v1.0/stock
    license_status: api_key_and_market_data_license_required
    update_frequency_seconds: 1
    reliability_tier: 1
    priority: 15
    domains: [prices_intraday, order_book]
    failover_source_ids: [twse_mis, yahoo_finance]
    host_aliases: []
    field_contract:
      authorization_required: true
      redistribution_allowed: false
      execution_eligible: true
      usage_boundary: licensed_account_only
  - source_id: fugle_stream
    display_name: Fugle licensed market data WebSocket
    authority: licensed_vendor
    base_url: wss://api.fugle.tw/marketdata/v1.0/stock
    license_status: api_key_and_market_data_license_required
    update_frequency_seconds: 1
    reliability_tier: 1
    priority: 15
    domains: [prices_intraday, order_book]
    failover_source_ids: [twse_mis]
    host_aliases: []
    field_contract:
      authorization_required: true
      redistribution_allowed: false
      execution_eligible: true
      usage_boundary: licensed_account_only
  - source_id: google_news
    display_name: Google News RSS
    authority: auxiliary_aggregator
    base_url: https://news.google.com
    license_status: publisher_and_google_terms_review_required
    update_frequency_seconds: 900
    reliability_tier: 3
    priority: 95
    domains: [news, events]
    failover_source_ids: []
    host_aliases: []
    field_contract:
      fallback_only: true
      execution_eligible: false
      redistribution_allowed: false
      usage_boundary: research_link_discovery

datasets:
  - dataset_id: twse_companies
    source_id: twse_openapi
    domain: security_master
    transport: http_json
    endpoint_path: opendata/t187ap03_L
    update_frequency_seconds: 21600
    fields: [code, short_name, legal_name, business_no, industry, listed_at, issued_common_shares]
    required_fields: [code, legal_name]
    optional_fields: [short_name, business_no, industry, listed_at, issued_common_shares]
    failure_strategy:
      max_attempts: 3
      timeout_seconds: 20
      backoff_seconds: [0.15, 0.3]
      retry_http_statuses: [408, 429, 500, 502, 503, 504]
      on_exhausted: fail_closed
      checkpoint_required: true
      preserve_error_payload: true
  - dataset_id: twse_quotes
    source_id: twse_openapi
    domain: security_master
    transport: http_json
    endpoint_path: exchangeReport/STOCK_DAY_ALL
    fields: [code, name, trade_date, open, high, low, close, volume]
    required_fields: [code, name]
    optional_fields: [trade_date, open, high, low, close, volume]
    failure_strategy:
      max_attempts: 3
      timeout_seconds: 20
      backoff_seconds: [0.15, 0.3]
      retry_http_statuses: [408, 429, 500, 502, 503, 504]
      on_exhausted: serve_stale
      stale_if_error_seconds: 86400
      checkpoint_required: true
      preserve_error_payload: true
  - dataset_id: twse_daily_valuation
    source_id: twse_openapi
    domain: fundamentals
    transport: http_json
    endpoint_path: exchangeReport/BWIBBU_ALL
    update_frequency_seconds: 86400
    fields: [date, code, pe, dividend_yield, pb]
    required_fields: [date, code]
    optional_fields: [pe, dividend_yield, pb]
    failure_strategy:
      max_attempts: 3
      timeout_seconds: 20
      checkpoint_required: false
      preserve_error_payload: true
  - dataset_id: twse_monthly_valuation_history
    source_id: twse_official_web
    domain: fundamentals
    transport: http_json
    endpoint_path: exchangeReport/BWIBBU
    update_frequency_seconds: 86400
    fields: [date, symbol, pe, dividend_yield, pb, fiscal_period]
    required_fields: [date, symbol]
    optional_fields: [pe, dividend_yield, pb, fiscal_period]
    failure_strategy:
      max_attempts: 2
      timeout_seconds: 20
      checkpoint_required: true
      preserve_error_payload: true
  - dataset_id: twse_stock_day
    source_id: twse_official_web
    domain: prices_daily
    transport: http_json
    endpoint_path: rwd/zh/afterTrading/STOCK_DAY
    fields: [symbol, trade_date, open, high, low, close, volume, turnover]
    required_fields: [symbol, trade_date, close]
    optional_fields: [open, high, low, volume, turnover]
    failure_strategy:
      max_attempts: 3
      timeout_seconds: 20
      backoff_seconds: [0.15, 0.3]
      retry_http_statuses: [408, 429, 500, 502, 503, 504]
      on_exhausted: use_failover
      failover_dataset_ids: [twse_quotes]
      checkpoint_required: true
      preserve_error_payload: true
  - dataset_id: twse_exright_results
    source_id: twse_official_web
    domain: corporate_actions
    transport: http_json
    endpoint_path: rwd/zh/exRight/TWT49U
    fields: [event_date, symbol, previous_close, reference_price, adjustment_value, event_type]
    required_fields: [event_date, symbol, previous_close, reference_price]
    optional_fields: [adjustment_value, event_type]
    failure_strategy:
      max_attempts: 3
      timeout_seconds: 20
      backoff_seconds: [0.15, 0.3]
      retry_http_statuses: [408, 429, 500, 502, 503, 504]
      on_exhausted: fail_closed
      checkpoint_required: true
      preserve_error_payload: true
  - dataset_id: twse_etfs
    source_id: twse_openapi
