release_requirement_overrides:
  A-007:
    status: partial
    acceptance: Host mutation validation emits a content-addressed receipt binding tool name, exact arguments, result, before/after state hashes and acceptance, then emits a provider-scoped domain receipt bound to that verified Host receipt; tampered receipts fail verification and mutation completion still requires the existing Host checks.
    evidence:
      - src/open_stock_ai/agent_runtime/mutation_receipts.py
      - src/open_stock_ai/agent_runtime/validators.py
      - tests/test_mutation_receipts.py
      - tests/test_mutation_receipts.py::test_host_mutation_postcondition_rejects_loose_domain_id_without_accepted_host_receipt
      - tests/test_mutation_receipts.py::test_domain_mutation_receipt_binds_provider_to_host_validated_receipt
      - src/stock_ai/broker_tools.py
      - tests/test_broker_framework.py::test_broker_order_proposal_is_local_unapproved_and_never_submitted
      - tests/test_broker_framework.py::test_broker_order_cancel_emits_accepted_receipt_only_for_existing_local_proposal
    blockers:
      - live_provider_side_effect_receipts_and_owner_verified_external_execution_evidence_are_not_yet_recorded
  A-006:
    status: partial
    acceptance: Durable memory candidates carry evidence trust and provenance; explicitly untrusted or below-threshold content is quarantined, excluded from active retrieval, and retained for audit until Host verification.
    evidence:
      - src/open_stock_ai/agent_runtime/memory/trust.py
      - src/open_stock_ai/agent_runtime/memory/governance.py
      - src/open_stock_ai/agent_runtime/memory/durable_governance.py
      - tests/test_memory_trust_quarantine.py
    blockers:
      - reviewed_malicious_memory_corpus_and_live_provider_to_memory_receipts_are_not_yet_recorded
  A-005:
    status: partial
    acceptance: External web/news/provider content is labelled as data-only with a content hash, no instruction authority, and Host-only tool authorization before provider context; hostile corpus and real provider receipts remain separate release evidence.
    evidence:
      - src/open_stock_ai/agent_runtime/untrusted_content.py
      - tests/fixtures/security/hostile_external_content.json
      - src/open_stock_ai/agent_runtime/context_broker_v2.py
      - src/open_stock_ai/agent_runtime/orchestrator.py
      - src/stock_ai/agent_drivers.py
      - tests/test_untrusted_content_boundary.py
      - tests/test_agent_runtime.py::test_provider_turn_records_verified_external_context_without_raw_content
      - src/stock_ai/ui/static/js/features/agent/agent-runtime-timeline.js
    blockers:
      - live_provider_runtime_receipt_and_independent_hostile_corpus_review_signoff_are_not_yet_recorded
  A-008:
    status: partial
    acceptance: Host-owned global, session, provider and tool cost budgets are charged atomically; recursive depth, node, repeated-tool, total-call and no-progress limits fail closed with a durable execution-guard snapshot.
    evidence:
      - src/open_stock_ai/agent_runtime/guardrails.py
      - src/open_stock_ai/agent_runtime/orchestrator.py
      - tests/test_agent_guardrails.py
    blockers:
      - reviewed_provider_cost_schedule_and_real_provider_runaway_chaos_receipts_are_not_yet_recorded
  A-009:
    status: partial
    acceptance: Provider failure is fail-closed by default; an alternate driver can be selected only by an explicit allowlist for advisory read-only work, with a visible quality-change notice and tamper-evident receipt, while paper, project, external and full execution remain blocked.
    evidence:
      - src/open_stock_ai/agent_runtime/provider_fallback.py
      - src/open_stock_ai/agent_runtime/orchestrator.py
      - tests/test_provider_fallback.py
    blockers:
