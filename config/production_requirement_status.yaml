schema_version: stock_ai.production_requirement_status.v1
source_of_truth: config/production_requirement_status.yaml
status_definitions:
  complete: Every stated acceptance condition has direct implementation and test evidence.
  partial: A production path exists, but at least one acceptance blocker remains.
  unverified: Names or code presence have not yet been accepted as evidence.
gates:
