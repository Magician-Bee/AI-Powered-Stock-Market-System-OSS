[project]
name = "stock-ai-ecosystem"
version = "0.1.0"
description = "股市 AI 完整生態系 MVP：市場資料、連動模型、查詢 API、Web GUI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.0",
  "yfinance>=0.2.66",
  "gymnasium>=1.0,<2",
  "pandas>=2.2.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "openai-codex>=0.147.0",
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "hypothesis>=6.112,<7",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_ai = [
  "ui/static/*",
  "ui/static/assets/*",
  "ui/static/vendor/*",
  "ui/static/css/core/*",
  "ui/static/css/features/*",
  "ui/static/css/shell/*",
  "ui/static/js/core/*",
  "ui/static/js/features/*",
  "ui/static/js/features/agent/*",
  "ui/static/js/shell/*",
]
